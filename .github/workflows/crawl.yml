name: crawl

on:
  schedule:
    - cron: "17 3,9,15,21 * * *" # 6時間おき(12:17 / 18:17 / 0:17 / 6:17 JST)。1回は最大約5.7時間で、重なった分は待機する
  workflow_dispatch:
    inputs:
      root_id:
        description: "店舗を集めるトップ階層のジャンルカテゴリID (13457=ファッション)"
        type: string
        default: "13457"
      collect_minutes:
        description: "新店舗の発見に使う最大時間(分)。実際は実行の残り時間の範囲内。動作確認では5など短くする"
        type: string
        default: "300"
      limit:
        description: "新店舗の情報取得: 今回取得する最大店舗数"
        type: string
        default: "5000"
      refresh_limit:
        description: "既存店舗の更新チェック: 今回チェックする最大店舗数"
        type: string
        default: "3000"
      refresh_days:
        description: "取得からこの日数が経った店舗を更新チェックする"
        type: string
        default: "30"
      recrawl_days:
        description: "この日数より古い検索の進捗は検索し直して、新店舗を見つける"
        type: string
        default: "30"

permissions:
  contents: read
  actions: read # 前回のArtifactをダウンロードするため

# 同時実行するとDBが食い違うので直列にする
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHubホステッドランナーのジョブ上限は360分
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      COLLECT_MINUTES: ${{ inputs.collect_minutes || '300' }}
      LIMIT: ${{ inputs.limit || '5000' }}
      REFRESH_LIMIT: ${{ inputs.refresh_limit || '3000' }}
      REFRESH_DAYS: ${{ inputs.refresh_days || '30' }}
      RECRAWL_DAYS: ${{ inputs.recrawl_days || '30' }}
      ROOT_ID: ${{ inputs.root_id || '13457' }}
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Check secrets
        run: |
          if [ -z "$DB_PASSPHRASE" ]; then
            echo "::error::Secret DB_PASSPHRASE が未設定です(個人情報を含むDBを暗号化するために必須)"
            exit 1
          fi

      - name: Restore DB from previous run
        id: restore
        run: scripts/restore_db.sh

      # 時間配分: ② と ③ は「やることがある分だけ」(未取得・更新対象の店舗がなくなれば、すぐ終わる)。
      # ① 新店舗の発見は、そのあとの「残り時間をすべて」使う(上限はジョブの330分目まで。ジョブ自体の上限は360分)。
      # ① を最後にしているのは、② ③ が空いた分の時間を、いちばん時間のかかる発見に回すため。

      # ② 新店舗の情報取得: まだ会社概要ページを取得していない店舗を取得する
      - name: "② Fetch info of new stores"
        # Ctrl-C相当(INT)で打ち切る。取得済み分は保存済みで、次回は続きから。
        timeout-minutes: 135
        run: |
          timeout -s INT 7200 shoplist fetch --limit "$LIMIT" || [ $? -eq 124 ]

      # ③ 既存店舗の情報更新: 取得から REFRESH_DAYS 日が経った店舗を古い順に取り直し、変更・閉店を記録する
      - name: "③ Refresh existing stores"
        if: ${{ !cancelled() }}  # ② が失敗しても続ける(アクセス制限でなければ動く)
        timeout-minutes: 105
        run: |
          timeout -s INT 5400 shoplist refresh --older-than-days "$REFRESH_DAYS" --limit "$REFRESH_LIMIT" || [ $? -eq 124 ]

      # ① 新店舗の発見: カテゴリー×価格帯ごとに商品検索して店舗IDを集める(粗い価格帯を全カテゴリーで一巡してから、細かい価格帯へ)。
      #    進捗はDBに保存され毎回続きから再開し、RECRAWL_DAYS より古い進捗は検索し直す(あとから増えた店舗を見つけるため)
      - name: "① Discover new stores (uses the remaining time)"
        if: ${{ !cancelled() }}
        # 回数制限(429)などで失敗しても、集めた分は保存されているので次のステップは続ける
        continue-on-error: true
        timeout-minutes: 340
        run: |
          budget=$(( (JOB_START + 330*60 - $(date +%s)) / 60 ))
          [ "$budget" -gt "$COLLECT_MINUTES" ] && budget=$COLLECT_MINUTES
          [ "$budget" -lt 5 ] && budget=5
          echo "発見に使う時間: ${budget}分"
          shoplist collect-categories --root-id "$ROOT_ID" --recrawl-days "$RECRAWL_DAYS" --max-minutes "$budget"

      - name: Export, encrypt
        if: always() && hashFiles('shops.db') != ''
        run: |
          mkdir -p out
          shoplist export --out shops.csv
          shoplist export --format full --include-closed --out shops_full.csv
          shoplist changes --since-days 3650 --out changes.csv
          scripts/crypt.sh enc shops.db out/shops.db.enc
          scripts/crypt.sh enc shops.csv out/shops.csv.enc
          scripts/crypt.sh enc shops_full.csv out/shops_full.csv.enc
          scripts/crypt.sh enc changes.csv out/changes.csv.enc
          echo '### 進捗' >> "$GITHUB_STEP_SUMMARY"
          shoplist status >> "$GITHUB_STEP_SUMMARY"

      # publicリポジトリのArtifactは誰でもダウンロードできるため、必ず暗号化したものだけを上げる
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/shops.db.enc') != ''
        with:
          name: shops-data
          path: out/
          retention-days: 90
