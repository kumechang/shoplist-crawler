name: crawl

on:
  schedule:
    - cron: "17 3 * * 1" # 毎週月曜 12:17 JST
  workflow_dispatch:
    inputs:
      root_id:
        description: "店舗を集めるトップ階層のジャンルカテゴリID (13457=ファッション)"
        type: string
        default: "13457"
      limit:
        description: "今回取得する最大店舗数"
        type: string
        default: "5000"

permissions:
  contents: read
  actions: read # 前回のArtifactをダウンロードするため

# 同時実行するとDBが食い違うので直列にする
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
      DB_PASSPHRASE: ${{ secrets.DB_PASSPHRASE }}
      LIMIT: ${{ inputs.limit || '5000' }}
      ROOT_ID: ${{ inputs.root_id || '13457' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Check secrets
        run: |
          if [ -z "$DB_PASSPHRASE" ]; then
            echo "::error::Secret DB_PASSPHRASE が未設定です(個人情報を含むDBを暗号化するために必須)"
            exit 1
          fi

      - name: Restore DB from previous run
        id: restore
        run: scripts/restore_db.sh

      - name: Collect seller IDs by category
        # カテゴリーごとに商品検索して、店舗IDとカテゴリーを集める。進捗はDBに保存され、毎回続きから再開する
        # (全カテゴリー完了後は何もしない)。回数制限(429)などで失敗しても、fetchは続ける
        continue-on-error: true
        timeout-minutes: 115
        run: shoplist collect-categories --root-id "$ROOT_ID" --max-minutes 100

      - name: Fetch store info
        # 3.5時間で打ち切る(Ctrl-C相当で止まり、取得済み分は保存済み)。次回は続きから。
        # (collect 最大100分 + fetch 210分 + 前後の処理が、ジョブの上限345分に収まるようにしている)
        timeout-minutes: 225
        run: |
          timeout -s INT 12600 shoplist fetch --limit "$LIMIT" || [ $? -eq 124 ]

      - name: Export, encrypt
        if: always() && hashFiles('shops.db') != ''
        run: |
          mkdir -p out
          shoplist export --out shops.csv
          scripts/crypt.sh enc shops.db out/shops.db.enc
          scripts/crypt.sh enc shops.csv out/shops.csv.enc
          echo '### 進捗' >> "$GITHUB_STEP_SUMMARY"
          shoplist status >> "$GITHUB_STEP_SUMMARY"

      # publicリポジトリのArtifactは誰でもダウンロードできるため、必ず暗号化したものだけを上げる
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/shops.db.enc') != ''
        with:
          name: shops-data
          path: out/
          retention-days: 90
